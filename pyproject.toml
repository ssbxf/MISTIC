[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "MISTIC"
version = "0.0.1"
description = "Microenvironment-Guided Integration of Spatial Transcriptomic Information Across Slices"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your_email@example.com"}
]


dependencies = [

    "scanpy>=1.9.8",
    "anndata>=0.9.2",
    

    "numpy>=1.24.1",
    "pandas>=2.0.3",
    "scipy>=1.10.1",
    

    "matplotlib>=3.7.5",
    "seaborn>=0.13.2",
    

    "scikit-learn>=1.3.2",
    "scikit-misc>=0.2.0",
    "annoy>=1.17.3",       
    "umap-learn>=0.5.7",   
    "leidenalg>=0.10.2",   
    "tqdm>=4.67.1",        




]

[tool.setuptools.packages.find]
where = ["src"]


[project.optional-dependencies]
dev = [
    "jupyterlab>=4.3.5",
    "ipykernel>=6.29.5"
]